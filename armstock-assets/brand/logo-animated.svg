<svg width="32" height="32" viewBox="-1 -2 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { transform-box: fill-box; animation: lift 3s infinite ease-in-out; }
    @keyframes lift { 0%, 100% { transform: translateY(0); opacity: 0.8; } 50% { transform: translateY(-1.5px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .box { animation: none; } }
  </style>
  <g class="box" style="animation-delay: 0s;">
    <rect x="2" y="16" width="13" height="13" rx="2" fill="#06b6d4"/>
    <rect x="7.25" y="16" width="2.5" height="4" fill="#164e63" fill-opacity="0.35"/>
  </g>
  <g class="box" style="animation-delay: 0.5s;">
    <rect x="9.5" y="1" width="13" height="13" rx="2" fill="#06b6d4"/>
    <rect x="14.75" y="1" width="2.5" height="4" fill="#164e63" fill-opacity="0.35"/>
  </g>
  <g class="box" style="animation-delay: 1s;">
    <rect x="17" y="16" width="13" height="13" rx="2" fill="#06b6d4"/>
    <rect x="22.25" y="16" width="2.5" height="4" fill="#164e63" fill-opacity="0.35"/>
  </g>
</svg>
