<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <style>
      .box { transform-box: fill-box; animation: lift 3s ease-in-out infinite; }
      .b2 { animation-delay: .5s; } .b3 { animation-delay: 1s; }
      @keyframes lift { 0%, 100% { transform: translateY(0); opacity: .85; } 50% { transform: translateY(-8px); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <linearGradient id="sky" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#164e63" flood-opacity="0.28"/>
    </filter>
    <clipPath id="disc"><circle cx="256" cy="256" r="170"/></clipPath>
  </defs>

  <circle cx="256" cy="256" r="170" fill="url(#sky)" filter="url(#shadow)"/>

  <g clip-path="url(#disc)">
    <path d="M66 368 Q256 352 446 368 V436 H66 Z" fill="#164e63" fill-opacity="0.55"/>
    <g class="box">
      <rect x="158" y="262" width="92" height="94" rx="14" fill="#ffffff"/>
      <rect x="194" y="262" width="20" height="30" fill="#0891b2" fill-opacity="0.45"/>
    </g>
    <g class="box b2">
      <rect x="210" y="158" width="92" height="94" rx="14" fill="#ffffff"/>
      <rect x="246" y="158" width="20" height="30" fill="#0891b2" fill-opacity="0.45"/>
    </g>
    <g class="box b3">
      <rect x="262" y="262" width="92" height="94" rx="14" fill="#ffffff"/>
      <rect x="298" y="262" width="20" height="30" fill="#0891b2" fill-opacity="0.45"/>
    </g>
    <ellipse cx="256" cy="136" rx="150" ry="70" fill="url(#shine)"/>
  </g>

  <circle cx="256" cy="256" r="158" fill="none" stroke="#a5f3fc" stroke-opacity="0.6" stroke-width="3"/>
</svg>
